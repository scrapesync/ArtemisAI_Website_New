version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR a week for the routine bumps. Majors still arrive on their own, because those
      # are the ones worth reading a changelog for.
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
