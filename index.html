<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080908" />
    <meta name="color-scheme" content="dark" />

    <title>Artemis — change the way you build on social media</title>
    <meta
      name="description"
      content="Artemis watches your pages every minute and tells you what to reply, when to post, and whether a draft will land. Read from two years of your own history, not an industry average."
    />
    <link rel="canonical" href="https://artemisai.co.uk/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Artemis" />
    <meta property="og:url" content="https://artemisai.co.uk/" />
    <meta property="og:title" content="Artemis — change the way you build on social media" />
    <meta
      property="og:description"
      content="Artemis watches your pages every minute, so you spend your time on the work instead of the feed."
    />
    <meta property="og:image" content="https://artemisai.co.uk/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Artemis — change the way you build on social media" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Artemis — change the way you build on social media" />
    <meta
      name="twitter:description"
      content="Artemis watches your pages every minute, so you spend your time on the work instead of the feed."
    />
    <meta name="twitter:image" content="https://artemisai.co.uk/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Archivo (display + body) and JetBrains Mono (numerals, kickers), self-hosted.
         The two faces above the fold are preloaded; the rest load on demand via unicode-range
         and font-weight matching. See scripts/fetch-fonts.mjs. -->
    <link
      rel="preload"
      href="/fonts/archivo-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/archivo-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Artemis",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://artemisai.co.uk/",
        "description": "Artemis watches a small business's social pages every minute and tells the owner what to reply, when to post, and whether a draft will land.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP",
          "description": "14-day free trial"
        },
        "publisher": {
          "@type": "Organization",
          "name": "ArtemisAI Ltd",
          "url": "https://artemisai.co.uk/",
          "email": "hello@artemisai.co.uk"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify detects forms by parsing the BUILT HTML at deploy time, which never sees a
      React-rendered form. This static twin is what registers `trial-signup`; the real form in
      the closing CTA posts to it. Field names must stay in sync with FaqFooter's form.
    -->
    <form name="trial-signup" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
