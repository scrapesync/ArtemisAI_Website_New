    <!-- Microsoft Clarity: the same project as the rest of artemisai.co.uk (decks, explainer). -->
    <script type="text/javascript">
      ;(function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            ;(c[a].q = c[a].q || []).push(arguments)
          }
        t = l.createElement(r)
        t.async = 1
        t.src = 'https://www.clarity.ms/tag/' + i
        y = l.getElementsByTagName(r)[0]
        y.parentNode.insertBefore(t, y)
      })(window, document, 'clarity', 'script', 'vfp7p4b3cv')
    </script>

    <!--
      Applied before first paint, so someone who chose light last visit never sees a frame of
      dark first. Deliberately inline and synchronous: a deferred module would run after the
      first paint, which is exactly the flash this prevents.

      Mirrors read() and applyTheme() in src/lib/useTheme.ts — the storage key and the two
      theme-color values have to stay in step with that file. Anything but the string 'light'
      falls back to dark, and the whole thing is wrapped because localStorage itself throws in
      some privacy modes.
    -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('artemis-theme') === 'light' ? 'light' : 'dark'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme
          if (theme === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#f6f3ee')
          }
        } catch (e) {
          /* No storage: the designed default stands. */
        }
      })()
    </script>

      With JavaScript off this page is an empty shell. Most crawlers execute JS and will see

    <!--
      Netlify detects forms by parsing the BUILT HTML at deploy time, which never sees a
      React-rendered form. This static twin is what registers `trial-signup`; the real form in
      the closing CTA posts to it. Field names must stay in sync with FaqFooter's form.
    -->
    <form name="pilot-waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
